name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ninja-build doxygen graphviz gcc-14 g++-14

    - name: Select GCC 14 (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja doxygen graphviz

    - name: Install build tools (Windows)
      if: runner.os == 'Windows'
      run: choco install --no-progress ninja doxygen.install graphviz

    - name: Add Doxygen to PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "C:\Program Files\doxygen\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh

    # Without this, Ninja picks up the runner's pre-installed MinGW instead of MSVC.
    - name: Set up MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: cmake --preset ${{ matrix.build_type }}

    - name: Build
      run: cmake --build --preset ${{ matrix.build_type }}

    - name: Test
      run: ctest --preset ${{ matrix.build_type }} --output-on-failure

  docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4

    - name: Install documentation tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build doxygen graphviz

    - name: Configure CMake
      run: cmake --preset Release -DPL_BUILD_TESTING=OFF

    - name: Build documentation
      run: cmake --build --preset Release --target pk-doxygen

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload documentation
      uses: actions/upload-pages-artifact@v3
      with:
        path: ../builds/pak-io/Release/build/docs/html

    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4




